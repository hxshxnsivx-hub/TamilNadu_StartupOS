[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanigam-backend"
version = "0.1.0"
description = "Tamil Nadu StartupOS (Vanigam) — backend API and multi-agent services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vanigam" }]

# Managed-API-first stack (see .kiro/specs/.../constraint-solutions.md §C/§E).
# Heavy self-host ML libs (torch/transformers) are intentionally NOT here yet;
# language + embedding + LLM go through swappable provider adapters.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pgvector>=0.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=8.4",
    "structlog>=24.1",
    # Optimization / graph core (used from Phase 2/3; light to install)
    "ortools>=9.10",
    "networkx>=3.3",
    "scipy>=1.13",
    "numpy>=1.26",
    # Agent orchestration
    "langgraph>=0.1",
    "langchain-core>=0.2",
    # LLM provider adapters (managed-API-first)
    "anthropic>=0.30",
    "openai>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that hit the database or external services",
    "property: Hypothesis property-based tests",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
